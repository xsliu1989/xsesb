server:
  port: 9521

spring:
  application:
    name: xrpc-admin
  datasource:
    url: jdbc:mysql://192.168.2.111:3306/esb_platform?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: root
    password: root234
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
